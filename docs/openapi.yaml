openapi: 3.0.3
info:
  title: WirePulse Enterprise API
  version: 0.1.0
  description: |
    Control plane for WirePulse: shared profiles and test suites, queued test jobs executed by on-premises
    gateway agents, privacy-preserving test evidence, and a tamper-evident audit trail.

    ## Authentication
    * **Humans** send an OIDC access token (`Authorization: Bearer <jwt>`). Only asymmetric algorithms are accepted.
      The token's email is used only when the identity provider marks it verified.
    * **CI** sends a workspace API key (`wpk_…`). Keys are scoped to one workspace, limited to `maintainer` or below,
      always expire, and can never create keys, invitations or workspaces.
    * **Gateway agents** send a gateway token (`wpg_…`) to `/gateway/v1/*` only. Human credentials are not accepted there
      and gateway tokens are not accepted under `/v1`.

    ## Roles
    `viewer` < `engineer` < `maintainer` < `administrator`, per workspace. Each operation states the minimum role in
    `x-required-role`. A caller whose role is too low, who is not a member of the workspace, or who names a workspace that
    does not exist, receives the same `403 insufficient_workspace_role`, so workspace ids cannot be probed. `404` means the
    workspace is accessible but the addressed object is not in it.

    ## Errors
    Every failure has the shape `{ "error": "<stable_code>", "requestId": "<id>", "details": {…} }`.
    The `X-Request-Id` response header carries the same id and appears in the server log and the audit trail.

    ## Pagination
    List endpoints that page return the next cursor in the `x-next-cursor` response header; pass it back as `cursor`.
    The header is absent on the last page. Cursors are opaque.

    ## Rate limits
    Limits are enforced per API instance: per client address, per authenticated subject, per gateway, and on repeated
    authentication failures. A throttled call returns `429` with `error: rate_limited` and `RateLimit-*` headers.
    The authentication-failure limit locks out the client address, including its valid requests, until the window ends.
  license:
    name: Proprietary
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: http://localhost:8080
        description: Public URL of the API (https in production)
tags:
  - name: Operations
  - name: Workspaces
  - name: Profiles and suites
  - name: Test jobs
  - name: Gateways
  - name: Webhooks
  - name: Test reports
  - name: Members and invitations
  - name: API keys
  - name: Audit
  - name: Gateway agent protocol
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Operations]
      summary: Liveness probe
      description: Answers while the process is up. Never touches the database and is exempt from rate limits.
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } }
  /readyz:
    get:
      tags: [Operations]
      summary: Readiness probe
      description: Checks the database. Returns 503 while shutting down so load balancers drain the instance.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready] }
                  checks: { type: object, properties: { database: { type: string, enum: [ok] } } }
        "503":
          description: Shutting down or the database is unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [shutting_down, unavailable] }
                  checks: { type: object, properties: { database: { type: string, enum: [failing] } } }
  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics
      description: |
        Requires `METRICS_TOKEN` when one is configured. Without a token it is open outside production and answers `404`
        in production. When `METRICS_PORT` is set, metrics move to that private port and this path answers `404` here.
      security: [{ metricsAuth: [] }, {}]
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workspaces:
    get:
      tags: [Workspaces]
      summary: List the caller's workspaces
      description: An API key sees only the workspace it belongs to, with the key's role.
      x-required-role: any member
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WorkspaceMembership" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Workspaces]
      summary: Create a workspace
      description: The creator becomes its first administrator. Human identities only.
      x-required-role: authenticated human
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], additionalProperties: false, properties: { name: { $ref: "#/components/schemas/Name" } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMembership" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces/{workspaceId}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    delete:
      tags: [Workspaces]
      summary: Offboard the workspace
      description: >
        Ends the workspace at once and schedules its content for removal. In one transaction: the workspace becomes unusable for
        every member, API key and gateway; queued and running jobs are cancelled; gateways, API keys and pending invitations are
        revoked; webhooks are disabled; undelivered webhook and email messages are failed (an email's text is discarded). The
        content itself is removed by a background worker once `purgeAfter` has passed (`WORKSPACE_PURGE_GRACE_DAYS`, default 30).
        Until then an operator can undo this with `admin-cli workspace restore` (revoked keys, gateways and invitations are not
        brought back). Afterwards only a tombstone and the append-only audit trail remain. The workspace no longer counts against
        the per-user workspace cap. Export the audit trail first: it cannot be read through the API once the workspace is deleted.
        The caller must be a person (not an API key) and must repeat the workspace's exact name in `confirm`.
      x-required-role: administrator
      parameters:
        - name: confirm
          in: query
          required: true
          description: The workspace's exact name, case sensitive (`confirmation_mismatch` otherwise)
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Workspace offboarded
          content:
            application/json:
              schema:
                type: object
                required: [id, deletedAt, purgeAfter]
                properties:
                  id: { type: string, format: uuid }
                  deletedAt: { type: string, format: date-time }
                  purgeAfter: { type: string, format: date-time, description: Earliest moment the content may be removed; restore is possible only before it }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces/{workspaceId}/usage:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Workspaces]
      summary: Plan, limits and current usage
      description: >
        The workspace's plan, that plan's limits and what the workspace consumes now. Counts are live; the monthly job and report
        counters are metered in the same transaction as the event they count, so they cannot drift from the records.
      x-required-role: viewer
      responses:
        "200":
          description: Plan, limits and usage
          content:
            application/json:
              schema:
                type: object
                required: [plan, limits, usage]
                properties:
                  plan: { $ref: "#/components/schemas/PlanName" }
                  limits: { $ref: "#/components/schemas/PlanLimits" }
                  usage: { $ref: "#/components/schemas/WorkspaceUsage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces/{workspaceId}/profiles:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Profiles and suites]
      summary: List shared profiles
      x-required-role: viewer
      responses:
        "200":
          description: Profiles, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ResourceSummary" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Profiles and suites]
      summary: Create a shared profile
      x-required-role: engineer
      requestBody: { $ref: "#/components/requestBodies/ResourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json: { schema: { $ref: "#/components/schemas/Resource" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/profiles/{id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    get:
      tags: [Profiles and suites]
      summary: Get a shared profile
      x-required-role: viewer
      responses:
        "200":
          description: The profile
          content:
            application/json: { schema: { $ref: "#/components/schemas/Resource" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Profiles and suites]
      summary: Replace a shared profile (optimistic concurrency)
      description: Send the version you read in `If-Match-Version`. A stale version answers `409 version_conflict_or_not_found`.
      x-required-role: engineer
      parameters: [{ $ref: "#/components/parameters/IfMatchVersion" }]
      requestBody: { $ref: "#/components/requestBodies/ResourceInput" }
      responses:
        "200":
          description: Updated; the version has been incremented
          content:
            application/json: { schema: { $ref: "#/components/schemas/Resource" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Profiles and suites]
      summary: Delete a shared profile
      description: Version history is kept, so every version a job ran against can still be recovered.
      x-required-role: maintainer
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/profiles/{id}/versions:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    get:
      tags: [Profiles and suites]
      summary: List the versions of a shared profile
      x-required-role: viewer
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ResourceVersion" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/profiles/{id}/versions/{version}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Version" }]
    get:
      tags: [Profiles and suites]
      summary: Get one version of a shared profile
      x-required-role: viewer
      responses:
        "200":
          description: The version, including its definition
          content:
            application/json: { schema: { $ref: "#/components/schemas/ResourceVersionDetail" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces/{workspaceId}/test-suites:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Profiles and suites]
      summary: List test suites
      x-required-role: viewer
      responses:
        "200":
          description: Suites, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ResourceSummary" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Profiles and suites]
      summary: Create a test suite
      x-required-role: engineer
      requestBody: { $ref: "#/components/requestBodies/ResourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json: { schema: { $ref: "#/components/schemas/Resource" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/test-suites/{id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    get:
      tags: [Profiles and suites]
      summary: Get a test suite
      x-required-role: viewer
      responses:
        "200":
          description: The suite
          content:
            application/json: { schema: { $ref: "#/components/schemas/Resource" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Profiles and suites]
      summary: Replace a test suite (optimistic concurrency)
      description: Send the version you read in `If-Match-Version`. A stale version answers `409 version_conflict_or_not_found`.
      x-required-role: engineer
      parameters: [{ $ref: "#/components/parameters/IfMatchVersion" }]
      requestBody: { $ref: "#/components/requestBodies/ResourceInput" }
      responses:
        "200":
          description: Updated; the version has been incremented
          content:
            application/json: { schema: { $ref: "#/components/schemas/Resource" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Profiles and suites]
      summary: Delete a test suite
      x-required-role: maintainer
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/test-suites/{id}/versions:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    get:
      tags: [Profiles and suites]
      summary: List the versions of a test suite
      x-required-role: viewer
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ResourceVersion" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/test-suites/{id}/versions/{version}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Version" }]
    get:
      tags: [Profiles and suites]
      summary: Get one version of a test suite
      x-required-role: viewer
      responses:
        "200":
          description: The version, including its definition
          content:
            application/json: { schema: { $ref: "#/components/schemas/ResourceVersionDetail" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces/{workspaceId}/test-jobs:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Test jobs]
      summary: List test jobs, newest first
      description: Lists omit `definition` and `result`; fetch a single job for those.
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit100" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/JobStatus" } }
        - { name: suiteId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: A page of jobs
          headers: { x-next-cursor: { $ref: "#/components/headers/NextCursor" } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Job" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Test jobs]
      summary: Queue a test job for a gateway to run
      description: |
        `idempotencyKey` makes retries safe: repeating the call with the same key and the same definition returns the
        existing job with `200`; the same key with a different definition is `409 idempotency_key_reused`.
        The queue is bounded per workspace (`429 queue_full`); the bound is checked without a global lock, so it is a soft limit.
        The job records the suite and profile versions it was queued against.
      x-required-role: engineer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "201":
          description: Queued
          content:
            application/json: { schema: { $ref: "#/components/schemas/Job" } }
        "200":
          description: Replay of an earlier request with the same idempotency key
          content:
            application/json: { schema: { $ref: "#/components/schemas/Job" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/test-jobs/stream:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Test jobs]
      summary: Live job updates (Server-Sent Events)
      description: |
        Streams `ready` once, then a `job` event (a list-shaped job without `definition` or `result`) on every change in this
        workspace, plus `: ping` comments as keep-alives. A `resync` event means events may have been missed: refetch the list.
        Browsers cannot set an Authorization header on `EventSource`; read the stream with `fetch` instead.
        Authorization is checked when the stream opens, so a credential revoked later keeps its open stream until the server
        closes it: streams end after at most `SSE_MAX_LIFETIME_SECONDS` (default 1800) and on shutdown, and clients should
        reconnect with backoff. Limits: `SSE_MAX_CLIENTS` per instance (`503 too_many_streams`) and 10 per subject
        (`429 too_many_streams_for_subject`); close the old stream before opening another.
      x-required-role: viewer
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/test-jobs/{id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    get:
      tags: [Test jobs]
      summary: Get a test job, including its definition and verified result
      x-required-role: viewer
      responses:
        "200":
          description: The job
          content:
            application/json: { schema: { $ref: "#/components/schemas/JobDetail" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/test-jobs/{id}/junit.xml:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    get:
      tags: [Test jobs]
      summary: JUnit XML of a finished job
      x-required-role: viewer
      responses:
        "200":
          description: JUnit XML
          content:
            application/xml: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The job has no results yet (error `job_has_no_results`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/test-jobs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    post:
      tags: [Test jobs]
      summary: Cancel a queued, assigned or running job
      description: A running gateway learns of the cancellation on its next lease renewal (`409 job_not_active`) and stops driving the device.
      x-required-role: engineer
      responses:
        "200":
          description: Cancelled
          content:
            application/json: { schema: { $ref: "#/components/schemas/Job" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The job already finished or was cancelled (error `job_not_cancellable`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces/{workspaceId}/gateways:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Gateways]
      summary: List gateways
      description: "`online` means a heartbeat arrived within the last 90 seconds. Token values are never returned here."
      x-required-role: viewer
      responses:
        "200":
          description: Gateways (revoked last)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Gateway" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Gateways]
      summary: Register a gateway
      description: The token is returned once, here, and only its hash is stored. Install it on the lab machine and restart the agent.
      x-required-role: maintainer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatewayInput" }
      responses:
        "201":
          description: Registered
          content:
            application/json: { schema: { $ref: "#/components/schemas/GatewayWithToken" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/gateways/{id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    patch:
      tags: [Gateways]
      summary: Replace a gateway's labels
      description: Label changes apply to the next claim. A job is offered only to gateways whose labels contain every label the job requires.
      x-required-role: maintainer
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [labels], additionalProperties: false, properties: { labels: { $ref: "#/components/schemas/Labels" } } }
      responses:
        "200":
          description: Updated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Gateway" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Gateways]
      summary: Revoke a gateway
      description: The token stops working immediately. A running agent receives `401` and exits.
      x-required-role: maintainer
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/gateways/{id}/rotate:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    post:
      tags: [Gateways]
      summary: Rotate a gateway token
      description: The previous token stops working immediately; the new one is shown once. Install it and restart the agent.
      x-required-role: maintainer
      responses:
        "200":
          description: Rotated
          content:
            application/json: { schema: { $ref: "#/components/schemas/GatewayWithToken" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces/{workspaceId}/webhooks:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Webhooks]
      summary: List webhooks
      description: Webhook configuration, ordered by name. Signing secrets are never returned here.
      x-required-role: administrator
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/WebhooksNotConfigured" }
    post:
      tags: [Webhooks]
      summary: Create a webhook
      description: >
        Registers an endpoint that receives a signed `POST` for each subscribed event. The signing secret is returned once, here (and again
        only by rotating it). Counts against the plan's `webhooks` limit. IP-literal URLs are checked now; host names are checked against
        the SSRF policy every time a delivery is attempted.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Created
          content:
            application/json: { schema: { $ref: "#/components/schemas/WebhookWithSecret" } }
        "400":
          description: Invalid request (`invalid_request`, `invalid_json`), or the URL is not usable (`invalid_webhook_url`, `webhook_destination_not_allowed`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/WebhooksNotConfigured" }
  /v1/workspaces/{workspaceId}/webhooks/{id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    get:
      tags: [Webhooks]
      summary: Read a webhook
      x-required-role: administrator
      responses:
        "200":
          description: The webhook
          content:
            application/json: { schema: { $ref: "#/components/schemas/Webhook" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/WebhooksNotConfigured" }
    patch:
      tags: [Webhooks]
      summary: Change a webhook
      description: >
        Changes the name, URL, subscribed events or the enabled flag. Deliveries already waiting use the new URL when they are next attempted.
        A disabled webhook fails its waiting deliveries as `webhook_disabled`.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Webhook" } }
        "400":
          description: Invalid request, or the URL is not usable (`invalid_webhook_url`, `webhook_destination_not_allowed`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/WebhooksNotConfigured" }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook
      description: Also removes its delivery history. Deliveries still waiting are dropped.
      x-required-role: administrator
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/WebhooksNotConfigured" }
  /v1/workspaces/{workspaceId}/webhooks/{id}/rotate-secret:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    post:
      tags: [Webhooks]
      summary: Rotate the signing secret
      description: The previous secret stops signing immediately, including for deliveries that are already waiting. The new secret is shown once.
      x-required-role: administrator
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                required: [secret, secretVersion]
                properties:
                  secret: { type: string, pattern: "^whsec_", description: Shown once }
                  secretVersion: { type: integer, minimum: 2 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/WebhooksNotConfigured" }
  /v1/workspaces/{workspaceId}/webhooks/{id}/ping:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    post:
      tags: [Webhooks]
      summary: Send a test event
      description: Queues a `webhook.ping` delivery through the same path as real events, so it exercises signing, the destination policy and retries. Read the outcome from the deliveries list.
      x-required-role: administrator
      responses:
        "202":
          description: Queued
          content:
            application/json: { schema: { $ref: "#/components/schemas/DeliveryQueued" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/WebhooksNotConfigured" }
  /v1/workspaces/{workspaceId}/webhooks/{id}/deliveries:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    get:
      tags: [Webhooks]
      summary: List deliveries
      description: Newest first. The stored error is a coarse class (`timeout`, `connection_failed`, `tls_error`, `dns_failed`, `destination_blocked`, `http_<status>`, …), never the receiver's response.
      x-required-role: administrator
      parameters:
        - { $ref: "#/components/parameters/Limit100" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, failed] } }
      responses:
        "200":
          description: Deliveries
          headers:
            x-next-cursor: { schema: { type: string }, description: Present when more deliveries exist }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/WebhooksNotConfigured" }
  /v1/workspaces/{workspaceId}/webhooks/{id}/deliveries/{deliveryId}/redeliver:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/DeliveryId" }]
    post:
      tags: [Webhooks]
      summary: Retry a failed delivery
      description: Puts a failed delivery back in the queue with a fresh set of attempts. The receiver sees the same `X-WirePulse-Delivery` id as before. Only failed deliveries can be redelivered.
      x-required-role: administrator
      responses:
        "202":
          description: Queued
          content:
            application/json: { schema: { $ref: "#/components/schemas/DeliveryQueued" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The delivery has not failed (`delivery_not_failed`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/WebhooksNotConfigured" }

  /v1/workspaces/{workspaceId}/test-reports:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Test reports]
      summary: List test reports, newest first
      x-required-role: viewer
      parameters: [{ $ref: "#/components/parameters/Limit100" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: A page of reports (summaries only)
          headers: { x-next-cursor: { $ref: "#/components/headers/NextCursor" } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Report" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Test reports]
      summary: Upload a report produced outside a gateway (for example from the browser)
      description: |
        The evidence hash chain is recomputed on the server and must match the results; otherwise the report is refused with
        `422 evidence_verification_failed`. Bodies up to the evidence limit (a few MiB) are accepted on this route.
      x-required-role: engineer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [id, createdAt, evidenceVerification]
                properties:
                  id: { type: string, format: uuid }
                  createdAt: { type: string, format: date-time }
                  evidenceVerification: { type: string, enum: [verified] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/EvidenceRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/test-reports/{id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    get:
      tags: [Test reports]
      summary: Get a report with its results and evidence
      x-required-role: viewer
      responses:
        "200":
          description: The report
          content:
            application/json: { schema: { $ref: "#/components/schemas/ReportDetail" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/test-reports/{id}/junit.xml:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    get:
      tags: [Test reports]
      summary: JUnit XML of a report
      x-required-role: viewer
      responses:
        "200":
          description: JUnit XML
          content:
            application/xml: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces/{workspaceId}/members:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Members and invitations]
      summary: List members
      x-required-role: maintainer
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Member" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/members/{subject}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { name: subject, in: path, required: true, description: The member's identity-provider subject, schema: { type: string } }
    put:
      tags: [Members and invitations]
      summary: Change a member's role
      description: The last administrator cannot be demoted (`409 last_administrator`), even by two concurrent requests.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], additionalProperties: false, properties: { role: { $ref: "#/components/schemas/Role" } } }
      responses:
        "200":
          description: Updated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Member" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Members and invitations]
      summary: Remove a member
      description: The last administrator cannot be removed (`409 last_administrator`).
      x-required-role: administrator
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/invitations:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Members and invitations]
      summary: List invitations
      x-required-role: administrator
      responses:
        "200":
          description: Invitations, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Members and invitations]
      summary: Invite a person by email
      description: |
        The API sends no email; tell the invitee to sign in. The invitation is matched to a *verified* email address from
        the identity provider when accepted, and can be used once. Human identities only.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, role], additionalProperties: false, properties: { email: { type: string, format: email, maxLength: 254 }, role: { $ref: "#/components/schemas/Role" } } }
      responses:
        "201":
          description: Created
          content:
            application/json: { schema: { $ref: "#/components/schemas/Invitation" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/invitations/{id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    delete:
      tags: [Members and invitations]
      summary: Revoke a pending invitation
      x-required-role: administrator
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/invitations:
    get:
      tags: [Members and invitations]
      summary: List the caller's pending invitations
      description: Matched on the caller's verified email. Human identities only; `403 verified_email_required` without one.
      x-required-role: authenticated human
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PendingInvitation" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/invitations/{id}/accept:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Members and invitations]
      summary: Accept an invitation
      x-required-role: authenticated human
      responses:
        "200":
          description: Joined the workspace
          content:
            application/json:
              schema: { type: object, required: [workspaceId, role], properties: { workspaceId: { type: string, format: uuid }, role: { $ref: "#/components/schemas/Role" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces/{workspaceId}/api-keys:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [API keys]
      summary: List API keys
      description: Only the 12-character prefix is shown; the key itself cannot be recovered.
      x-required-role: administrator
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [API keys]
      summary: Create an API key for CI
      description: |
        The key is returned once and only its hash is stored. Keys are workspace-scoped, never `administrator`, and always
        expire (default 90 days, capped by the server's `API_KEY_MAX_DAYS`). Human identities only.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json: { schema: { $ref: "#/components/schemas/ApiKeyWithToken" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/api-keys/{id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/Id" }]
    delete:
      tags: [API keys]
      summary: Revoke an API key
      x-required-role: administrator
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces/{workspaceId}/audit-events:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Audit]
      summary: Query the audit trail, newest first
      x-required-role: administrator
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: from, in: query, description: Inclusive lower bound, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Exclusive upper bound, schema: { type: string, format: date-time } }
        - { name: action, in: query, description: Exact action name such as `gateway.revoked`, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: A page of events
          headers: { x-next-cursor: { $ref: "#/components/headers/NextCursor" } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/audit-events/export.ndjson:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Audit]
      summary: Export the audit trail as NDJSON for a SIEM or archive
      description: One event per line in chain order. Each line carries `prev_hash` and `row_hash`, so an offline copy can be verified independently.
      x-required-role: administrator
      parameters:
        - { name: afterSeq, in: query, description: Resume after this `chain_seq`, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 100000 } }
      responses:
        "200":
          description: Newline-delimited JSON, one AuditEvent per line
          content:
            application/x-ndjson: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/workspaces/{workspaceId}/audit/verify:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Audit]
      summary: Recompute the audit hash chain in the database
      description: |
        Reports the first broken link, if any. Large trails are verified in bounded steps: while `complete` is false, call
        again with `fromSeq=nextFromSeq`. Record `headHash` somewhere the database operator cannot write (a SIEM, a ticket,
        object storage with retention); the chain alone cannot reveal a rewrite of its own tail by a database superuser.
      x-required-role: administrator
      parameters:
        - { name: fromSeq, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Verification result
          content:
            application/json: { schema: { $ref: "#/components/schemas/AuditVerification" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /gateway/v1/heartbeat:
    post:
      tags: [Gateway agent protocol]
      summary: Report liveness, version and capabilities
      description: Call every 15–30 seconds, independently of job activity, so the gateway stays online during long jobs.
      security: [{ gatewayAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                agentVersion: { type: string, maxLength: 60 }
                capabilities: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted; `leaseSeconds` is the job lease the agent must renew within
          content:
            application/json:
              schema: { type: object, required: [status, leaseSeconds], properties: { status: { type: string, enum: [ok] }, leaseSeconds: { type: integer } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gateway/v1/jobs/claim:
    post:
      tags: [Gateway agent protocol]
      summary: Claim the next job
      description: |
        Highest priority first, then oldest, among queued jobs whose `requirements` are all present in the gateway's labels.
        The claim starts a lease (`leaseExpiresAt`); if the agent stops renewing it the job returns to the queue, or becomes
        `timed_out` once `maxAttempts` is used up.
      security: [{ gatewayAuth: [] }]
      responses:
        "200":
          description: A job was assigned to this gateway
          content:
            application/json: { schema: { $ref: "#/components/schemas/JobClaim" } }
        "204": { description: Nothing to do }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gateway/v1/jobs/{id}/start:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Gateway agent protocol]
      summary: Mark a claimed job as running and renew its lease
      security: [{ gatewayAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeaseRenewed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/JobNotActive" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gateway/v1/jobs/{id}/progress:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Gateway agent protocol]
      summary: Report progress and renew the lease
      description: "`409 job_not_active` means the job was cancelled or requeued: stop driving the device and do not report a result."
      security: [{ gatewayAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Progress" }
      responses:
        "200": { $ref: "#/components/responses/LeaseRenewed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/JobNotActive" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gateway/v1/jobs/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Gateway agent protocol]
      summary: Deliver the results and evidence
      description: |
        The server recomputes the evidence chain and the fingerprints of the job's definition; the final status is derived from
        that verified evidence and is never taken from the agent. `409` and `422` are final answers and must not be retried;
        `429`, `5xx` and network errors may be retried.
      security: [{ gatewayAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteInput" }
      responses:
        "200":
          description: Accepted; the job is finished
          content:
            application/json: { schema: { $ref: "#/components/schemas/Job" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/JobNotActive" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/EvidenceRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OIDC access token (humans) or a workspace API key `wpk_…` (CI)
    gatewayAuth:
      type: http
      scheme: bearer
      description: Gateway token `wpg_…`, accepted only under `/gateway/v1`
    metricsAuth:
      type: http
      scheme: bearer
      description: The configured `METRICS_TOKEN`; API credentials do not work here
  headers:
    NextCursor:
      description: Opaque cursor for the next page; absent on the last page
      schema: { type: string }
  parameters:
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    DeliveryId: { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
    Version: { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      description: The `version` last read; the update applies only if it is still current
      schema: { type: integer, minimum: 1 }
    Limit100: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Cursor: { name: cursor, in: query, description: Value of the previous page's `x-next-cursor` header, schema: { type: string } }
  requestBodies:
    ResourceInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ResourceInput" }
  responses:
    BadRequest:
      description: Malformed or invalid request (`invalid_request` with field details, `invalid_json`, `invalid_identifier`, `invalid_cursor`, `confirmation_mismatch`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing, invalid, expired or revoked credential (`bearer_token_required`, `invalid_bearer_token`, `gateway_token_required`, `invalid_gateway_token`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated but not allowed (`insufficient_workspace_role` covers a role that is too low, a non-member, an API key scoped to another workspace and an unknown or deleted workspace alike; also `human_identity_required`, `verified_email_required`, and `plan_limit_reached` / `workspace_limit_reached` when the plan's quota is used up, with `details.resource`, `details.plan` and `details.limit`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: The addressed object does not exist in this workspace
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: State conflict (`version_conflict_or_not_found`, `idempotency_key_reused`, `last_administrator`, `already_member`, …)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    WebhooksNotConfigured:
      description: The deployment has no `WEBHOOK_SIGNING_KEY`, so webhooks are not available (`webhooks_not_configured`). Only callers allowed to use the feature see this
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PreconditionRequired:
      description: "`If-Match-Version` header missing (`if_match_version_required`)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooLarge:
      description: Body exceeds the limit (`payload_too_large`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests (`rate_limited`, which also covers the workspace plan's per-minute request limit, or `queue_full` when queueing jobs)
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    EvidenceRejected:
      description: The evidence failed verification (`evidence_verification_failed`) or belongs to another job (`evidence_job_mismatch`)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [evidence_verification_failed, evidence_job_mismatch] }
              reason: { type: string }
    JobNotActive:
      description: The job is not active for this gateway (cancelled, requeued, finished, or never claimed by it)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [job_not_active] }
              status: { allOf: [{ $ref: "#/components/schemas/JobStatus" }], nullable: true }
    LeaseRenewed:
      description: Lease renewed
      content:
        application/json:
          schema: { type: object, required: [status, leaseSeconds], properties: { status: { type: string, enum: [running] }, leaseSeconds: { type: integer } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Stable machine-readable code }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
    Name: { type: string, minLength: 1, maxLength: 120 }
    Role: { type: string, enum: [viewer, engineer, maintainer, administrator] }
    Labels:
      type: object
      maxProperties: 20
      description: Up to 20 labels; keys 1–64 characters, values up to 128
      additionalProperties: { type: string, maxLength: 128 }
    JobStatus: { type: string, enum: [queued, assigned, running, passed, failed, stopped, cancelled, timed_out] }
    WorkspaceMembership:
      type: object
      required: [id, name, role, plan, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        plan: { $ref: "#/components/schemas/PlanName" }
        createdAt: { type: string, format: date-time }
    PlanName:
      type: string
      description: Plan that bounds this workspace's consumption (`free`, `team`, `business`, `enterprise`); an unknown name is treated as `free`
    PlanLimits:
      type: object
      description: Limits of the plan; `null` means unlimited
      required: [members, gateways, apiKeys, webhooks, queuedJobs, jobsPerMonth, reportsPerMonth, requestsPerMinute]
      properties:
        members: { type: integer, nullable: true }
        gateways: { type: integer, nullable: true }
        apiKeys: { type: integer, nullable: true }
        webhooks: { type: integer, nullable: true }
        queuedJobs: { type: integer, nullable: true }
        jobsPerMonth: { type: integer, nullable: true }
        reportsPerMonth: { type: integer, nullable: true }
        requestsPerMinute: { type: integer, nullable: true }
    WorkspaceUsage:
      type: object
      required: [period, members, pendingInvitations, gateways, apiKeys, webhooks, queuedJobs, jobsThisMonth, reportsThisMonth]
      properties:
        period: { type: string, format: date, description: First day of the metering month (UTC) }
        members: { type: integer }
        pendingInvitations: { type: integer }
        gateways: { type: integer, description: "Active (not revoked) gateways" }
        apiKeys: { type: integer, description: "Active (not revoked, not expired) API keys" }
        webhooks: { type: integer }
        queuedJobs: { type: integer }
        jobsThisMonth: { type: integer }
        reportsThisMonth: { type: integer }
    ResourceInput:
      type: object
      required: [name, definition]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/Name" }
        definition: { type: object, additionalProperties: true }
    Resource:
      type: object
      required: [id, name, definition, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        definition: { type: object, additionalProperties: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    ResourceSummary:
      description: A profile or suite without its definition (GET the item for that); lists stay small however large the definitions are.
      type: object
      required: [id, name, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    ResourceVersion:
      type: object
      required: [version, name, createdAt]
      properties:
        version: { type: integer }
        name: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ResourceVersionDetail:
      allOf:
        - { $ref: "#/components/schemas/ResourceVersion" }
        - type: object
          properties:
            definition: { type: object, additionalProperties: true }
    JobInput:
      type: object
      required: [definition, idempotencyKey]
      additionalProperties: false
      properties:
        definition: { type: object, additionalProperties: true, description: "`tests` and `profile`, as produced by the web app" }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        suiteId: { type: string, format: uuid, nullable: true }
        profileId: { type: string, format: uuid, nullable: true }
        priority: { type: integer, minimum: -10, maximum: 10, default: 0 }
        requirements: { $ref: "#/components/schemas/Labels" }
        maxAttempts: { type: integer, minimum: 1, maximum: 10, description: Server default when omitted }
    Progress:
      type: object
      required: [completed, total]
      additionalProperties: false
      properties:
        completed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, description: "`completed` may not exceed `total`" }
    JobSummary:
      type: object
      required: [passed, failed, total, evidenceSchema, evidenceFinalHash]
      properties:
        passed: { type: integer }
        failed: { type: integer }
        total: { type: integer }
        evidenceSchema: { type: string, enum: [wirepulse.test-evidence.v1] }
        evidenceFinalHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    Job:
      type: object
      required: [id, status, attempts, maxAttempts, priority, requirements, createdAt]
      properties:
        id: { type: string, format: uuid }
        suiteId: { type: string, format: uuid, nullable: true }
        suiteVersion: { type: integer, nullable: true }
        profileId: { type: string, format: uuid, nullable: true }
        profileVersion: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/JobStatus" }
        gatewayId: { type: string, format: uuid, nullable: true }
        priority: { type: integer }
        requirements: { $ref: "#/components/schemas/Labels" }
        progress: { allOf: [{ $ref: "#/components/schemas/Progress" }], nullable: true }
        summary: { allOf: [{ $ref: "#/components/schemas/JobSummary" }], nullable: true }
        error: { type: string, nullable: true, description: "For example `gateway_lease_expired` or `queue_ttl_expired`" }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        version: { type: integer }
        definitionHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        agentVersion: { type: string, nullable: true }
        engineFingerprint: { type: string, nullable: true, description: Hash of the validation engine that produced the evidence }
        requestedBy: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        leaseExpiresAt: { type: string, format: date-time, nullable: true }
    JobDetail:
      allOf:
        - { $ref: "#/components/schemas/Job" }
        - type: object
          properties:
            definition: { type: object, additionalProperties: true }
            result: { allOf: [{ $ref: "#/components/schemas/TestRunResult" }], nullable: true }
    JobClaim:
      allOf:
        - { $ref: "#/components/schemas/Job" }
        - type: object
          required: [definition]
          properties:
            definition: { type: object, additionalProperties: true }
    TestResult:
      type: object
      required: [testId, status, attempts]
      additionalProperties: false
      properties:
        testId: { type: string }
        status: { type: string, enum: [passed, failed, not-run] }
        attempts: { type: integer, minimum: 0 }
    Evidence:
      type: object
      required: [schema, evidenceId, createdAt, fingerprints, rootHash, events, finalHash]
      additionalProperties: false
      description: |
        A hash-chained log of what the run did (commands transmitted, response windows, assertions). It carries fingerprints
        and hashes, not the device data itself. The server recomputes the chain; any edit, reorder, truncation or splice breaks it.
      properties:
        schema: { type: string, enum: [wirepulse.test-evidence.v1] }
        evidenceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        fingerprints:
          type: object
          required: [suite, profile, engine]
          additionalProperties: false
          properties:
            suite: { type: string, pattern: "^[a-f0-9]{64}$" }
            profile: { type: string, pattern: "^[a-f0-9]{64}$" }
            engine: { type: string, pattern: "^[a-f0-9]{64}$" }
        rootHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        events:
          type: array
          minItems: 2
          maxItems: 10000
          items:
            type: object
            required: [sequence, at, type, payload, previousHash, hash]
            properties:
              sequence: { type: integer, minimum: 0 }
              at: { type: integer, minimum: 0 }
              type: { type: string, enum: [run.started, attempt.started, command.transmitted, response.window.opened, assertion.completed, attempt.timed_out, run.finished, run.stopped] }
              payload: { type: object, additionalProperties: true }
              previousHash: { type: string, pattern: "^[a-f0-9]{64}$" }
              hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        finalHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    TestRunResult:
      type: object
      required: [results, evidence]
      additionalProperties: false
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/TestResult" } }
        evidence: { $ref: "#/components/schemas/Evidence" }
    CompleteInput:
      allOf:
        - { $ref: "#/components/schemas/TestRunResult" }
    ReportInput:
      type: object
      required: [summary, result]
      additionalProperties: false
      properties:
        suiteId: { type: string, format: uuid, nullable: true }
        summary: { $ref: "#/components/schemas/JobSummary" }
        result: { $ref: "#/components/schemas/TestRunResult" }
    Report:
      type: object
      required: [id, summary, createdAt]
      properties:
        id: { type: string, format: uuid }
        suiteId: { type: string, format: uuid, nullable: true }
        summary: { $ref: "#/components/schemas/JobSummary" }
        createdBy: { type: string, description: "A subject, or `gateway:<id>` for reports produced by a gateway job" }
        createdAt: { type: string, format: date-time }
    ReportDetail:
      allOf:
        - { $ref: "#/components/schemas/Report" }
        - type: object
          properties:
            result: { $ref: "#/components/schemas/TestRunResult" }
    GatewayInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/Name" }
        labels: { $ref: "#/components/schemas/Labels" }
        expiresInDays: { type: integer, minimum: 1, maximum: 3650, description: Token lifetime; omit for a token that lasts until rotated or revoked }
    Gateway:
      type: object
      required: [id, name, online, labels, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        online: { type: boolean, description: A heartbeat arrived within the last 90 seconds }
        labels: { $ref: "#/components/schemas/Labels" }
        lastHeartbeatAt: { type: string, format: date-time, nullable: true }
        agentVersion: { type: string, nullable: true }
        capabilities: { type: object, nullable: true, additionalProperties: true }
        tokenExpiresAt: { type: string, format: date-time, nullable: true }
        tokenRotatedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    GatewayWithToken:
      allOf:
        - { $ref: "#/components/schemas/Gateway" }
        - type: object
          required: [token]
          properties:
            token: { type: string, pattern: "^wpg_[A-Za-z0-9_-]{40,}$", description: Shown once }
    WebhookEvent:
      type: string
      enum: [job.finished]
      description: "`job.finished` is sent when a job reaches a final state (passed, failed, timed out or cancelled). `webhook.ping` is sent only by the ping endpoint and needs no subscription."
    WebhookInput:
      type: object
      required: [name, url]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/Name" }
        url: { type: string, maxLength: 2048, description: "http or https, no credentials in the URL. Plain http is accepted only for allow-listed networks (`WEBHOOK_ALLOWED_CIDRS`)" }
        events: { type: array, minItems: 1, maxItems: 16, items: { $ref: "#/components/schemas/WebhookEvent" }, description: "Default `[job.finished]`" }
    WebhookUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/Name" }
        url: { type: string, maxLength: 2048 }
        events: { type: array, minItems: 1, maxItems: 16, items: { $ref: "#/components/schemas/WebhookEvent" } }
        enabled: { type: boolean }
    Webhook:
      type: object
      required: [id, name, url, events, enabled, secretVersion, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        events: { type: array, items: { $ref: "#/components/schemas/WebhookEvent" } }
        enabled: { type: boolean }
        secretVersion: { type: integer, minimum: 1, description: "Increases each time the secret is rotated" }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WebhookWithSecret:
      allOf:
        - { $ref: "#/components/schemas/Webhook" }
        - type: object
          required: [secret]
          properties:
            secret: { type: string, pattern: "^whsec_", description: "Shown once. Receivers verify `X-WirePulse-Signature` (`t=<unix seconds>,v1=<hex HMAC-SHA256 of \"<t>.<raw body>\">`) with it" }
    WebhookDelivery:
      type: object
      required: [id, eventType, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid, description: "Sent as `X-WirePulse-Delivery` and stable across retries, so receivers can de-duplicate" }
        eventType: { type: string }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        lastStatus: { type: integer, nullable: true, description: "HTTP status of the last attempt, when the receiver answered" }
        lastError: { type: string, nullable: true, description: "Coarse failure class of the last attempt" }
        createdAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time, nullable: true, description: "Only while pending" }
        finishedAt: { type: string, format: date-time, nullable: true }
    DeliveryQueued:
      type: object
      required: [deliveryId]
      properties:
        deliveryId: { type: string, format: uuid }
    Member:
      type: object
      required: [subject, role, createdAt]
      properties:
        subject: { type: string }
        email: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, email, role, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        invitedBy: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        acceptedBy: { type: string, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    PendingInvitation:
      type: object
      required: [id, role, expiresAt, workspaceId, workspaceName]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        expiresAt: { type: string, format: date-time }
        workspaceId: { type: string, format: uuid }
        workspaceName: { type: string }
    ApiKeyInput:
      type: object
      required: [name, role]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/Name" }
        role: { type: string, enum: [viewer, engineer, maintainer] }
        expiresInDays: { type: integer, minimum: 1, description: "Default 90, capped by the server's API_KEY_MAX_DAYS" }
    ApiKey:
      type: object
      required: [id, name, role, prefix, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [viewer, engineer, maintainer] }
        prefix: { type: string, description: "First 12 characters of the key, for identification" }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    ApiKeyWithToken:
      allOf:
        - { $ref: "#/components/schemas/ApiKey" }
        - type: object
          required: [token]
          properties:
            token: { type: string, pattern: "^wpk_", description: Shown once }
    AuditEvent:
      type: object
      description: A row of the per-workspace hash chain. Field names are snake_case because the row is returned as stored.
      required: [id, chain_seq, action, created_at, prev_hash, row_hash]
      properties:
        id: { type: string, description: "Database identifier (a 64-bit integer, serialised as a string)" }
        chain_seq: { type: string, pattern: "^[0-9]+$", description: "Position in this workspace's chain, starting at 1 (a 64-bit integer, serialised as a decimal string)" }
        actor_subject: { type: string, nullable: true, description: "A subject, `gateway:<id>`, or `system:<component>`" }
        action: { type: string }
        resource_type: { type: string, nullable: true }
        resource_id: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        details: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        prev_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        row_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
    AuditVerification:
      type: object
      required: [valid, checked, complete]
      properties:
        valid: { type: boolean }
        checked: { type: integer, description: Rows verified in this call }
        firstBadSeq: { type: integer, nullable: true, description: "`chain_seq` of the first row whose hash or link does not match, or of the first gap" }
        lastSeq: { type: integer, nullable: true }
        headHash: { type: string, nullable: true, description: Hash of the last verified row; anchor it outside the database }
        complete: { type: boolean, description: False when the call stopped early; continue from `nextFromSeq` }
        nextFromSeq: { type: integer, nullable: true }
