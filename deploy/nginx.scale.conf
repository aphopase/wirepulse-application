# Load balancer for the scale-out example (docker-compose.scale.yml). Docker's DNS answers `api` with the address of every replica;
# nginx re-resolves it every few seconds, so `docker compose up --scale api=N` takes effect without a reload.
# TLS is not terminated here: put your own certificate-bearing proxy or cloud load balancer in front, or add `listen 443 ssl`.
events { worker_connections 4096; }
http {
  access_log off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8080;
    # A variable in proxy_pass makes nginx use the resolver above on every request instead of once at start-up.
    set $api http://api:8080;
    location / {
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # This proxy is the edge, so it replaces rather than appends: a client cannot choose the address the API rate-limits.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Live job updates are Server-Sent Events: no buffering, and a read timeout longer than the API's stream lifetime.
      proxy_buffering off;
      proxy_read_timeout 1h;
      # A replica that is stopping or restarting answers the next healthy one (GET and idempotent calls only; nginx never retries a POST).
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
    }
  }
}
